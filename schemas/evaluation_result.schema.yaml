schema: evaluation_result
version: 0.1
description: 한국어 캐릭터 대사 검수 결과 형식
required:
  - scores
  - findings
  - rewrite_suggestion
score_range:
  min: 1
  max: 5
scores:
  naturalness: integer
  character_fit: integer
  relationship_fit: integer
  speech_level_consistency: integer
  humor_timing: integer
  cringe_risk: integer
  anachronism_risk: integer
  genre_fit: integer
finding_fields:
  - line_ref
  - issue
  - reason
  - risk_tags
  - suggested_action
rewrite_suggestion:
  type: string
  rule: 의미와 캐릭터 기능을 유지한 최소 수정만 쓴다.

