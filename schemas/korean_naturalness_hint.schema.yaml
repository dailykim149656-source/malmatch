schema: korean_naturalness_hints
version: 0.3.1
description: 한국어 문법성, 한국어다운 표현, 구어 리듬 보정 힌트 형식
required:
  - basis
  - input_metrics
  - axes
  - hints
  - signal_catalog
basis:
  stored_text: boolean
  source_text_values: string
  rule_source: string
input_metrics:
  line_count: integer
  total_chars: integer
  avg_chars: number
  max_chars: integer
  short_reaction_count: integer
  written_sentence_count: integer
  explicit_pronoun_count: integer
axis_values:
  - grammar_acceptability
  - native_korean_idiom
  - spoken_korean_rhythm
hint_fields:
  - axis
  - hint
  - confidence
  - signals
  - line_refs
  - rationale
hint:
  type: integer
  allowed_values: [-1, 0, 1]
signal_catalog:
  type: object
  key: signal id string
  value: source-text-free Korean description for the triggered signal
confidence:
  type: number
  range: 0.0-0.99
rule: 힌트는 naturalness 점수를 대체하지 않고 문법성, 번역투, 구어 리듬 검토 우선순위를 제공한다.
